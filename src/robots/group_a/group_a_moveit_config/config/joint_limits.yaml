# joint_limits.yaml allows the dynamics properties specified in the URDF to be overwritten or augmented as needed

# For beginners, we downscale velocity and acceleration limits.
# You can always specify higher scaling factors (<= 1.0) in your motion requests.
# Increase the values below to 1.0 to always move at maximum speed.
default_velocity_scaling_factor: 1.0
default_acceleration_scaling_factor: 1.0

# Specific joint properties can be changed with the keys [max_position, min_position, max_velocity, max_acceleration]
# Joint limits can be turned off with [has_velocity_limits, has_acceleration_limits]
joint_limits:
  # --- Ewelix TLT600 Lift Joints ---
  $(var namespace)/$(var tf_prefix)lift_lower_joint:
    has_position_limits: true
    min_position: -0.001 # Προσθήκη ανοχής για αποφυγή του CheckStartStateBounds error
    max_position: 0.30 # Από τα specs της Ewelix (lower.joint.limit.upper)
    has_velocity_limits: true
    max_velocity: 0.088 # Από τα specs της Ewelix (lower.joint.limit.velocity)
    has_acceleration_limits: true
    max_acceleration: 0.2

  $(var namespace)/$(var tf_prefix)lift_upper_joint:
    has_position_limits: true
    min_position: -0.001 # Προσθήκη ανοχής για αποφυγή του CheckStartStateBounds error
    max_position: 0.30 # Από τα specs της Ewelix (upper.joint.limit.upper)
    has_velocity_limits: true
    max_velocity: 0.088 # Από τα specs της Ewelix (upper.joint.limit.velocity)
    has_acceleration_limits: true
    max_acceleration: 0.2

  # --- Universal Robots UR10 CB3 Joints (Converted to Radians) ---
  $(var namespace)/$(var tf_prefix)ur_shoulder_pan_joint:
    has_position_limits: true
    min_position: -6.283185307179586 # -360 μοίρες σε ακτίνια
    max_position: 6.283185307179586 # 360 μοίρες σε ακτίνια
    has_velocity_limits: true
    max_velocity: 2.0943951023931953 # 120 μοίρες/sec σε ακτίνια
    has_acceleration_limits: true
    max_acceleration: 5.0

  $(var namespace)/$(var tf_prefix)ur_shoulder_lift_joint:
    has_position_limits: true
    min_position: -6.283185307179586 # -360 μοίρες σε ακτίνια
    max_position: 6.283185307179586 # 360 μοίρες σε ακτίνια
    has_velocity_limits: true
    max_velocity: 2.0943951023931953 # 120 μοίρες/sec σε ακτίνια
    has_acceleration_limits: true
    max_acceleration: 5.0

  $(var namespace)/$(var tf_prefix)ur_elbow_joint:
    has_position_limits: true
    min_position: -3.141592653589793 # -180 μοίρες σε ακτίνια (τεχνητός περιορισμός λόγω MoveIt)
    max_position: 3.141592653589793 # 180 μοίρες σε ακτίνια (τεχνητός περιορισμός λόγω MoveIt)
    has_velocity_limits: true
    max_velocity: 3.141592653589793 # 180 μοίρες/sec σε ακτίνια
    has_acceleration_limits: true
    max_acceleration: 5.0

  $(var namespace)/$(var tf_prefix)ur_wrist_1_joint:
    has_position_limits: true
    min_position: -6.283185307179586 # -360 μοίρες σε ακτίνια
    max_position: 6.283185307179586 # 360 μοίρες σε ακτίνια
    has_velocity_limits: true
    max_velocity: 3.141592653589793 # 180 μοίρες/sec σε ακτίνια
    has_acceleration_limits: true
    max_acceleration: 5.0

  $(var namespace)/$(var tf_prefix)ur_wrist_2_joint:
    has_position_limits: true
    min_position: -6.283185307179586 # -360 μοίρες σε ακτίνια
    max_position: 6.283185307179586 # 360 μοίρες σε ακτίνια
    has_velocity_limits: true
    max_velocity: 3.141592653589793 # 180 μοίρες/sec σε ακτίνια
    has_acceleration_limits: true
    max_acceleration: 5.0

  $(var namespace)/$(var tf_prefix)ur_wrist_3_joint:
    has_position_limits: true
    min_position: -6.283185307179586 # -360 μοίρες σε ακτίνια
    max_position: 6.283185307179586 # 360 μοίρες σε ακτίνια
    has_velocity_limits: true
    max_velocity: 3.141592653589793 # 180 μοίρες/sec σε ακτίνια
    has_acceleration_limits: true
    max_acceleration: 5.0
