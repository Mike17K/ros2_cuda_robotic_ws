/**:
  ros__parameters:
    sensors:
      - pointcloud_sensor

    pointcloud_sensor:
      sensor_plugin: occupancy_map_monitor/PointCloudOctomapUpdater
      point_cloud_topic: /nvblox_node/static_occupancy
      max_range: 3.0
      point_subsample: 1
      padding_offset: 0.05
      padding_scale: 1.0
      max_update_rate: 2.0
      filtered_cloud_topic: $(var namespace)/filtered_cloud
