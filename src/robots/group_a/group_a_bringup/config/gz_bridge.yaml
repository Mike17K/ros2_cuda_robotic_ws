# Gazebo ↔ ROS 2 bridge topics for Group A.
# Clock is already bridged by the simulation package — do not duplicate it here.

# ── Orbbec camera ──────────────────────────────────────────────────────────────

- ros_topic_name: "/group_a/camera/color/image_raw"
  gz_topic_name: "/group_a/camera/rgbd/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/group_a/camera/depth/image_raw"
  gz_topic_name: "/group_a/camera/rgbd/depth_image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/group_a/camera/depth/points"
  gz_topic_name: "/group_a/camera/rgbd/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS

- ros_topic_name: "/group_a/camera/color/camera_info"
  gz_topic_name: "/group_a/camera/rgbd/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

# ── Odometry (from PosePublisher plugin) ───────────────────────────────────────

- ros_topic_name: "/group_a/pose"
  gz_topic_name: "/model/group_a/pose"
  ros_type_name: "geometry_msgs/msg/PoseArray"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS
