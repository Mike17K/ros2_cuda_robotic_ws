# Position / target tracking parameters
# Joystick buttons for mode switching
mode_toggle_button: 6
mode_reset_button: 7

# Position target motion when in position mode (updated every control tick)
position_target_step_xy_m: 0.10
position_target_step_z_m: 0.05
position_target_step_yaw_deg: 10.0

# Position controller gains
position_xy_gain: 0.35

# Altitude controller gains
altitude_Kp: 50.0
altitude_Ki: 9.0
altitude_Kd: 50.5
altitude_integral_limit: 200.0
altitude_integral_leak_rate: 0.0

# Safety / limits for position mode
max_position_tilt_deg: 15.0
